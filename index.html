<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("color-scheme");
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (stored === "light" || stored === "dark") {
            if (meta) meta.setAttribute("content", stored);
            document.documentElement.classList.toggle("dark", stored === "dark");
          } else {
            var prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.classList.toggle("dark", prefersDark);
          }
        } catch (e) {}
      })();
    </script>
    <title>Atnan Septian Wijanarko | Pengembang Software: App, Web, dan IoT</title>

      content="Portofolio pribadi Atnan Septian Wijanarko, mahasiswa Teknik Informatika UMS sejak 2024 yang berfokus pada pengembangan app, web modern, dan IoT."
    />
